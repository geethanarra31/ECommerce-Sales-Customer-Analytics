{% extends "base.html" %}
{% block title %}Profile{% endblock %}
{% block content %}
<div class="form-card">
<h2>👤 My Profile</h2>
<p><strong>Name:</strong> {{ user.name }}</p>
<p><strong>Email:</strong> {{ user.email }}</p>
<p><strong>Account created:</strong> {{ user.created_at.strftime("%d-%m-%Y") }}</p>
<a class="btn" href="{{ url_for('logout') }}">Logout</a>
</div>
{% endblock %}
