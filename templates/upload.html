{% extends "base.html" %}
{% block title %}Upload Data{% endblock %}
{% block content %}
<div class="form-card">
<h2>Upload E-Commerce CSV</h2>
<p>Upload a CSV containing product, category, price, rating/review and sales information.</p>
<form method="POST" enctype="multipart/form-data">
<input type="file" name="file" accept=".csv" required>
<button class="btn" type="submit">Upload & Analyze</button>
</form>
<p><a href="{{ url_for('dashboard') }}">Back to dashboard</a></p>
</div>
{% endblock %}
